name: iOS ARM64 bootstrap

on:
  push:
    branches:
      - main
      - "ios/**"
  pull_request:
  workflow_dispatch:

jobs:
  portability-and-simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Portable runtime smoke test (macOS)
        run: |
          set -euo pipefail
          xcrun clang -std=c11 -O2 -Wall -Wextra ios/Portability/Probe.c ios/Portability/GuestMemory.c ios/Portability/GuestMemoryBinding.c ios/Portability/ProbeTranslated.c ios/Portability/GuestDispatch.c ios/tests/aot_fixture/synthetic_game.c ios/Portability/ProbeCli.c -I runtime -o "$RUNNER_TEMP/ssbu-portability-test"
          "$RUNNER_TEMP/ssbu-portability-test"

      - name: iOS ARM64 C syntax check
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos clang -std=c11 -arch arm64 -miphoneos-version-min=16.0 -fsyntax-only ios/Portability/Probe.c ios/Portability/GuestMemory.c ios/Portability/GuestMemoryBinding.c ios/Portability/ProbeTranslated.c ios/Portability/GuestDispatch.c ios/tests/aot_fixture/synthetic_game.c -I runtime

      - name: AOT compile synthetic lifted code into iOS ARM64 archive
        run: |
          set -euo pipefail
          python3 ios/scripts/compile_generated.py \
            --generated ios/tests/aot_fixture \
            --output "$RUNNER_TEMP/ssbu-aot-archive" \
            --jobs 2
          test -s "$RUNNER_TEMP/ssbu-aot-archive/libssbu_generated_ios_arm64.a"
          xcrun --sdk iphoneos ar -t "$RUNNER_TEMP/ssbu-aot-archive/libssbu_generated_ios_arm64.a" | grep -q synthetic_game.o

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Build unsigned iOS Simulator app
        run: |
          set -euo pipefail
          xcodebuild -project ios/SSBURecompIOS.xcodeproj \
            -scheme SSBURecompIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ssbu-ios-derived" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build unsigned iOS ARM64 device app
        run: |
          set -euo pipefail
          xcodebuild -project ios/SSBURecompIOS.xcodeproj \
            -scheme SSBURecompIOS \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ssbu-ios-device" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Check linked ARM64 fixture archive
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/ssbu-ios-device/Build/Products/Debug-iphoneos/libSSBULiftedFixture.a"
          test -s "$ARCHIVE"
          xcrun --sdk iphoneos nm "$ARCHIVE" | grep -q "_fn_table"
          xcrun --sdk iphoneos nm "$ARCHIVE" | grep -q "_ssbu_synthetic_lifted_fn"

      - name: Upload simulator-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssbu-recomp-ios-bootstrap-simulator
          path: ${{ runner.temp }}/ssbu-ios-derived/Build/Products/Debug-iphonesimulator/SSBURecompIOS.app
          if-no-files-found: error
