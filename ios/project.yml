name: SSBURecompIOS
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  LiftedFixture:
    type: library.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: tests/aot_fixture/synthetic_game.c
    settings:
      base:
        PRODUCT_NAME: SSBULiftedFixture
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../runtime"
        GCC_PREPROCESSOR_DEFINITIONS: "SSBU_GUEST_ADDRESS_TRANSLATION=1 $(inherited)"
        GCC_C_LANGUAGE_STANDARD: gnu11
        SKIP_INSTALL: YES
  LiftedSDKFixture:
    type: library.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: tests/aot_fixture/synthetic_sdk.c
    settings:
      base:
        PRODUCT_NAME: SSBULiftedSDKFixture
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../runtime"
        GCC_C_LANGUAGE_STANDARD: gnu11
        SKIP_INSTALL: YES
  SSBURecompIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: Portability
        excludes:
          - ProbeCli.c
    dependencies:
      - target: LiftedFixture
      - target: LiftedSDKFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ssbu.recomp.ios.bootstrap
        PRODUCT_NAME: SSBURecompIOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/SSBURecompIOS-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
schemes:
  SSBURecompIOS:
    build:
      targets:
        SSBURecompIOS: all
